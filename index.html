<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programme Jérémy V2 Premium</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto;background:#f5f7fb;margin:0;padding:0}
header{background:white;padding:20px;text-align:center;font-weight:bold;font-size:20px;border-bottom:1px solid #eee}
.container{padding:15px}
.card{background:white;border-radius:15px;padding:15px;margin-bottom:15px;box-shadow:0 5px 15px rgba(0,0,0,0.05)}
.days{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.day{padding:15px;text-align:center;border-radius:12px;background:#eef2ff;cursor:pointer}
.exercise{margin-bottom:20px}
button{padding:10px 15px;border:none;border-radius:10px;background:#4f46e5;color:white;font-weight:bold;cursor:pointer}
.timer{font-size:22px;margin:10px 0}
.hidden{display:none}
</style>
</head>
<body>
<header>Programme Jérémy 💪</header>
<div class="container" id="home">
<div class="card">
<h3>📊 Dashboard</h3>
<p>Semaine automatique ✔️</p>
</div>
<div class="card">
<h3>📅 Semaine</h3>
<div class="days">
<div class="day" onclick="openDay('lundi')">Lundi</div>
<div class="day" onclick="openDay('mercredi')">Mercredi</div>
<div class="day" onclick="openDay('jeudi')">Jeudi</div>
</div>
</div>
</div>

<div class="container hidden" id="session">
<button onclick="back()">⬅ Retour</button>
<div id="content"></div>
</div>

<script>
const data={
 lundi:[
  {name:'Poulie Crossover',video:'https://www.youtube.com/embed/bMNGiVvBzuA'},
  {name:'Développé épaules haltères',video:'https://www.youtube.com/embed/B-aVuyhvLHU'},
  {name:'Élévations latérales',video:'https://www.youtube.com/embed/3VcKaXpzqRo'}
 ],
 mercredi:[
  {name:'Tirage vertical',video:'https://www.youtube.com/embed/dOukQ7QBSQs'},
  {name:'Tirage horizontal',video:'https://www.youtube.com/embed/KHoIpdn-oNI'},
  {name:'Curl biceps',video:'https://www.youtube.com/embed/ykJmrZ5v0Oo'}
 ],
 jeudi:[
  {name:'Crossover poulie',video:'https://www.youtube.com/embed/bMNGiVvBzuA'},
  {name:'Arrière épaules poulie',video:'https://www.youtube.com/embed/EA7u4Q_8HQ0'},
  {name:'Shrugs',video:'https://www.youtube.com/embed/cJRVVxmytaM'}
 ]
};

function openDay(day){
 document.getElementById('home').classList.add('hidden');
 document.getElementById('session').classList.remove('hidden');
 const container=document.getElementById('content');
 container.innerHTML='';
 data[day].forEach((ex,i)=>{
  container.innerHTML+=`
   <div class="card exercise">
   <h3>${ex.name}</h3>
   <iframe width="100%" height="200" src="${ex.video}" frameborder="0" allowfullscreen></iframe>
   <div>
    <label><input type="checkbox"> Série 1</label><br>
    <label><input type="checkbox"> Série 2</label><br>
    <label><input type="checkbox"> Série 3</label>
   </div>
   <button onclick="startTimer()">⏱ Lancer repos</button>
   </div>
  `;
 });
}

function back(){
 document.getElementById('session').classList.add('hidden');
 document.getElementById('home').classList.remove('hidden');
}

function startTimer(){
 let time=60;
 const t=setInterval(()=>{
  if(time<=0){clearInterval(t);alert('Repos terminé 💪');}
  time--;
 },1000);
}
</script>
</body>
</html>
